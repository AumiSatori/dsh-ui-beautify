name: Validate preset market
on:
  push:
    paths: ['market/**', 'src/preset-*', 'scripts/preset-market.mjs', '.github/workflows/preset-market*']
  pull_request:
    paths: ['market/**', 'src/preset-*', 'scripts/preset-market.mjs', '.github/workflows/preset-market*']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/preset-market.mjs validate
      - run: node --test test/preset-market.test.mjs
