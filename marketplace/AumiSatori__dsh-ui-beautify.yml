url: https://github.com/AumiSatori/dsh-ui-beautify
name: AumiSatori/dsh-ui-beautify
category: ui
description:
  en: 'Personalize DSH with glass surfaces, independent light and dark themes, image/video/HTML backgrounds, particles, custom greetings, overlay sidebars, task and Artifact cards, message bubbles, smooth answer streaming, and settings import/export. Requires DSH 0.2.1-rc.2 or later (below 0.3); tested on 0.2.1-rc.5 and 0.2.2-rc.1. macOS has not been verified on real hardware; if the overlay sidebar does not follow a resize drag, turn off Overlay sidebar to use the native one.'
  zh: '自定义 DSH 玻璃材质与独立明暗主题，支持图片、视频与 HTML 背景、粒子、自定义问候与开屏、覆盖侧栏、任务与 Artifact 卡片、消息气泡、回答逐字渐显，以及配置导入导出。需要 DSH 0.2.1-rc.2 及以上（低于 0.3），已在 0.2.1-rc.5 与 0.2.2-rc.1 上测试。macOS 尚未在实机验证；如果覆盖侧栏拖动调宽时不跟随，可关闭「覆盖侧栏」改用原生侧栏。'
